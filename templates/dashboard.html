<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Applications</title>
<style>
  :root {
    color-scheme: dark light;
    --bg: #0b0f15; --surface: #141a22; --surface-2: #1c2430; --border: #2a3441;
    --text: #e6edf3; --muted: #8b98a5; --accent: #4f8cff; --accent-text: #fff;
    --green: #3fb950; --amber: #d29922; --red: #f85149; --blue: #58a6ff;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f8fa; --surface: #ffffff; --surface-2: #eef1f5; --border: #d0d7de;
      --text: #1f2328; --muted: #59636e; --accent: #0969da; --accent-text: #fff;
      --green: #1a7f37; --amber: #9a6700; --red: #cf222e; --blue: #0969da;
      --shadow: 0 1px 2px rgba(0,0,0,.08);
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button, select, input, textarea { font: inherit; color: inherit; }
  button {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px;
    padding: 5px 10px; cursor: pointer; line-height: 1.2; white-space: nowrap;
  }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: transparent; }
  button.danger { color: var(--red); }
  button.ghost { background: transparent; border-color: transparent; color: var(--muted); }
  button.ghost:hover { color: var(--text); border-color: var(--border); }
  button:disabled { opacity: .5; cursor: default; }
  input[type=text], input[type=url], input[type=tel], input[type=search], select, textarea {
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px;
  }
  textarea { width: 100%; resize: vertical; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 16px; }

  /* Header */
  header { padding: 18px 0 8px; }
  header .top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  header h1 { font-size: 20px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
  header .build { color: var(--muted); font-size: 12px; margin-left: 8px; font-weight: 400; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    background: var(--surface); border: 1px solid var(--border); border-radius: 999px;
    padding: 4px 12px; cursor: pointer; font-size: 13px; color: var(--muted);
  }
  .chip b { color: var(--text); font-weight: 650; margin-right: 4px; }
  .chip small { color: var(--muted); }
  .chip.active { border-color: var(--accent); color: var(--text); }
  .actions { margin-left: auto; display: flex; gap: 8px; align-items: center; position: relative; }
  .menu { position: absolute; right: 0; top: 36px; z-index: 20; background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); padding: 6px; min-width: 200px; }
  .menu button, .menu label { display: block; width: 100%; text-align: left; background: none; border: none;
    padding: 7px 10px; border-radius: 6px; cursor: pointer; }
  .menu button:hover, .menu label:hover { background: var(--surface-2); }
  .file-status { font-size: 12px; color: var(--muted); padding: 2px 0 10px; }
  .file-status.linked { color: var(--green); }
  .file-status.error { color: var(--red); }
  .file-status.saving { color: var(--amber); }

  /* Attention strip */
  .attention { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 0 0 12px;
    padding: 8px 12px; background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--amber);
    border-radius: 8px; font-size: 13px; }
  .attention a { color: var(--text); cursor: pointer; }
  .attention .sep { color: var(--border); }

  /* Tabs */
  .tabs { display: flex; align-items: center; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 8px; flex-wrap: wrap; }
  .tabs button.tab { background: none; border: none; border-bottom: 2px solid transparent; border-radius: 0;
    padding: 8px 12px; color: var(--muted); margin-bottom: -1px; }
  .tabs button.tab.active { color: var(--text); border-bottom-color: var(--accent); }
  .tabs button.tab .n { color: var(--muted); font-size: 12px; margin-left: 4px; }
  .tabs .spacer { flex: 1; }
  .tabs input[type=search] { min-width: 220px; padding: 5px 9px; }
  .tabs select { padding: 5px 8px; }
  .filter-pill { display: inline-flex; align-items: center; gap: 6px; background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 999px; padding: 2px 8px 2px 10px; font-size: 12px; color: var(--muted); }
  .filter-pill button { padding: 0 4px; border: none; background: none; color: var(--muted); }

  /* Bulk bar */
  .bulk { display: flex; gap: 10px; align-items: center; padding: 6px 10px; margin-bottom: 8px;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; font-size: 13px; }

  /* Rows */
  .row { display: grid; grid-template-columns: 22px 12px 1fr auto; gap: 10px; align-items: center;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 6px;
    cursor: pointer; }
  .row:hover { border-color: var(--muted); }
  .row.open { border-bottom-left-radius: 0; border-bottom-right-radius: 0; margin-bottom: 0; }
  .row .sel { margin: 0; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
  .tier-strong .dot { background: var(--green); }
  .tier-ok .dot { background: var(--blue); }
  .tier-weak .dot { background: var(--amber); }
  .main { min-width: 0; }
  .line1 { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; min-width: 0; }
  .title { font-weight: 600; color: var(--text); }
  .title:hover { color: var(--blue); }
  .company { color: var(--muted); }
  .badge { font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
  .badge.agency { color: var(--amber); border-color: var(--amber); }
  .badge.unverified { color: var(--muted); border-style: dashed; }
  .badge.outcome-offer { color: var(--green); border-color: var(--green); }
  .badge.outcome-rejected { color: var(--red); border-color: var(--red); }
  .badge.outcome-archived { color: var(--muted); }
  .meta { color: var(--muted); font-size: 12px; margin-top: 2px; display: flex; gap: 6px; flex-wrap: wrap; }
  .side { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; font-size: 12px; color: var(--muted); }
  .side .btns { display: flex; gap: 6px; }
  .side button { padding: 4px 9px; font-size: 12px; }
  .cvlink { white-space: nowrap; }
  .cvlink.none { color: var(--muted); font-style: italic; }

  .expand { background: var(--surface); border: 1px solid var(--border); border-top: none;
    border-radius: 0 0 8px 8px; padding: 12px 14px 14px 44px; margin-bottom: 6px; font-size: 13px; }
  .expand h4 { margin: 10px 0 4px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .expand ul { margin: 0; padding-left: 18px; }
  .expand p { margin: 0; white-space: pre-wrap; }
  .expand .reasons { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
  .expand .foot { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 12px; color: var(--muted); font-size: 12px; }
  .expand textarea { margin-top: 4px; min-height: 48px; font-size: 13px; }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
  .empty a { cursor: pointer; }

  /* Modal */
  .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: flex-start;
    justify-content: center; padding: 40px 12px; z-index: 50; overflow: auto; }
  .backdrop.show { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; width: min(720px, 100%);
    padding: 18px 20px; box-shadow: var(--shadow); }
  .modal h2 { margin: 0 0 12px; font-size: 16px; }
  .modal .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .modal .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
  .modal .field label { font-size: 12px; color: var(--muted); }
  .modal .field input[type=text], .modal .field input[type=url], .modal .field input[type=tel] { width: 100%; }
  .modal .check { flex-direction: row; align-items: center; gap: 8px; }
  .modal .foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }

  @media (max-width: 760px) {
    .row { grid-template-columns: 22px 12px 1fr; }
    .side { grid-column: 1 / -1; justify-content: flex-start; padding-left: 32px; }
    .expand { padding-left: 14px; }
    .tabs input[type=search] { min-width: 0; flex: 1; }
    .modal .grid2 { grid-template-columns: 1fr; }
    header .actions { margin-left: 0; }
  }
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="top">
    <h1>Job Applications <span class="build">built __BUILD_TIME__</span></h1>
    <div class="chips" id="chips"></div>
    <div class="actions">
      <button id="add-btn" class="primary">+ Add</button>
      <button id="link-btn">Link folder…</button>
      <button id="menu-btn" title="More">⋯</button>
      <div class="menu" id="menu" hidden>
        <button data-menu="import">Import JSON…</button>
        <button data-menu="export">Export JSON</button>
        <button data-menu="reset">Reset local cache</button>
        <label><input type="checkbox" id="show-archived"> Show archived in Done</label>
      </div>
      <input type="file" id="import-input" accept=".json,application/json" hidden>
    </div>
  </div>
  <div id="file-status" class="file-status not-linked">Not linked — edits stay in this browser. Click "Link folder…" and pick the project folder to save into jobs.json.</div>
</header>

<div id="attention" class="attention" hidden></div>

<nav class="tabs" id="tabs">
  <button class="tab active" data-tab="inbox">Inbox<span class="n"></span></button>
  <button class="tab" data-tab="applied">Applied<span class="n"></span></button>
  <button class="tab" data-tab="interview">Interviews<span class="n"></span></button>
  <button class="tab" data-tab="done">Done<span class="n"></span></button>
  <span id="filter-pill" class="filter-pill" hidden><span id="filter-label"></span><button id="filter-clear" title="Clear">×</button></span>
  <span class="spacer"></span>
  <input id="search" type="search" placeholder="Search position, company, notes…">
  <select id="sort">
    <option value="fit">Sort: Fit</option>
    <option value="newest">Sort: Newest</option>
    <option value="company">Sort: Company</option>
  </select>
</nav>

<div class="bulk" id="bulk" hidden>
  <span><b id="bulk-count">0</b> selected</span>
  <button id="bulk-archive">Archive selected</button>
  <button id="bulk-clear" class="ghost">Clear</button>
</div>

<main id="list"></main>
<div id="empty" class="empty" hidden>Nothing here.</div>

</div>

<div class="backdrop" id="backdrop">
  <div class="modal" role="dialog" aria-modal="true">
    <h2 id="modal-title">Edit job</h2>
    <div class="grid2">
      <div class="field"><label>Position</label><input id="m-position" type="text" dir="auto"></div>
      <div class="field"><label>Company</label><input id="m-company" type="text" dir="auto"></div>
    </div>
    <div class="grid2">
      <div class="field"><label>Link</label><input id="m-link" type="url" placeholder="https://…"></div>
      <div class="field"><label>Location</label><input id="m-location" type="text" dir="auto"></div>
    </div>
    <div class="grid2">
      <div class="field"><label>Recruiter phone</label><input id="m-phone" type="tel" placeholder="+972 50-123-4567"></div>
      <div class="field check"><input id="m-agency" type="checkbox"><label for="m-agency">Staffing agency (not the employer)</label></div>
    </div>
    <div class="field"><label>Requirements (one per line)</label><textarea id="m-requirements" rows="5" dir="auto"></textarea></div>
    <div class="field"><label>Notes</label><textarea id="m-notes" rows="2" dir="auto"></textarea></div>
    <div class="foot">
      <button id="m-cancel">Cancel</button>
      <button id="m-save" class="primary">Save</button>
    </div>
  </div>
</div>

<script>
// ---------------------------------------------------------------------------
// Data. JOBS is the snapshot embedded at build time (schema v2). Fields that
// start with "_" are derived at build time and never written back.
// ---------------------------------------------------------------------------
const JOBS = __JOBS_JSON__;
const CFG = __CONFIG_JSON__;
const STORAGE_KEY = 'job_tracker_state_v3';
const STATUSES = ['new', 'applied', 'interview', 'offer', 'rejected', 'archived'];
const USER_FIELDS = ['status', 'status_source', 'status_changed_at', 'applied_at', 'applied_via',
                     'followed_up_at', 'archive_reason', 'notes', 'recruiter_phone', 'agency'];
const OVERRIDABLE = ['position', 'company', 'link', 'location', 'requirements'];
const TAB_STATUSES = { inbox: ['new'], applied: ['applied'], interview: ['interview'], done: ['offer', 'rejected', 'archived'] };
const TIER_RANK = { strong: 0, ok: 1, weak: 2 };
const FSA_SUPPORTED = 'showDirectoryPicker' in window;

const $ = (id) => document.getElementById(id);
const nowIso = () => new Date().toISOString().replace(/\.\d{3}Z$/, 'Z');

// Local patch layer: id -> partial record with user fields + overrides.
// Lives in localStorage so the page works without a linked folder; flushed
// into jobs.json (field-scoped) whenever a folder is linked.
let state = {};
try { state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}') || {}; } catch (_) { state = {}; }
function saveState() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (_) {} }

let dirHandle = null, saveTimer = null;
let tab = 'inbox', sort = 'fit', query = '', attentionFilter = null, showArchived = false;
const selected = new Set();
const opened = new Set();

function getJ(id) { return JOBS.find(j => j.id === id); }
function eff(id) {
  const j = getJ(id) || {};
  const s = state[id] || {};
  const out = { ...j };
  for (const k of USER_FIELDS) if (k in s) out[k] = s[k];
  if (s.overrides) for (const k of OVERRIDABLE) if (k in s.overrides) out[k] = s.overrides[k];
  if (s.overrides && 'requirements' in s.overrides) out.extraction_ok = (out.requirements || []).length >= 2 || (out.description || '').length >= 200;
  return out;
}
function patch(id) {
  if (!state[id]) state[id] = {};
  return state[id];
}
function commit(id) { saveState(); render(); scheduleFileSave(); }

// ---------------------------------------------------------------------------
// Status transitions
// ---------------------------------------------------------------------------
function setStatus(id, status, opts = {}) {
  const cur = eff(id);
  const p = patch(id);
  const t = nowIso();
  p.status = status;
  p.status_source = 'user';
  p.status_changed_at = t;
  if (status === 'applied' && !cur.applied_at) { p.applied_at = t; p.applied_via = 'manual'; }
  if (status === 'archived') p.archive_reason = opts.reason || 'skipped';
  else if (cur.archive_reason) p.archive_reason = null;
  if (!opts.silent) commit(id);
}
function markFollowedUp(id) { patch(id).followed_up_at = nowIso(); commit(id); }

// ---------------------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------------------
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function daysSince(ts) { if (!ts) return null; const d = new Date(ts); if (isNaN(d)) return null; return Math.floor((Date.now() - d.getTime()) / 86400000); }
function rel(ts) {
  const d = daysSince(ts);
  if (d === null) return '';
  if (d <= 0) return 'today';
  if (d === 1) return '1d';
  if (d < 14) return d + 'd';
  if (d < 60) return Math.floor(d / 7) + 'w';
  return Math.floor(d / 30) + 'mo';
}
function shortDate(ts) { return ts ? String(ts).slice(0, 10) : ''; }
function cvLink(j) {
  const pdf = j._cv_pdf || (j.cv_variant ? `cv/tailored/${j.id}.pdf` : null);
  if (!pdf) return '<span class="cvlink none">no CV yet</span>';
  const label = j.cv_variant ? `CV: ${esc(j.cv_variant)}` : 'CV';
  return `<a class="cvlink" href="${esc(pdf)}" target="_blank" rel="noopener" title="Open fitted CV">${label} ↗</a>`;
}
function needsFollowUp(j) {
  if (j.status !== 'applied') return false;
  const since = j.followed_up_at && j.followed_up_at > (j.applied_at || '') ? j.followed_up_at : j.applied_at;
  const d = daysSince(since);
  if (d === null || d < CFG.followup_days) return false;
  const emailDate = j.last_email && j.last_email.date;
  return !(emailDate && emailDate >= (j.applied_at || '').slice(0, 10));
}
function isUnverified(j) { return j.status === 'new' && !j.extraction_ok; }
function allEff() { return JOBS.map(j => eff(j.id)); }

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------
function visible() {
  const q = query.trim().toLowerCase();
  let rows = allEff().filter(j => {
    const statuses = TAB_STATUSES[tab];
    if (!statuses.includes(j.status)) return false;
    if (tab === 'done' && j.status === 'archived' && !showArchived) return false;
    if (attentionFilter === 'unverified' && !isUnverified(j)) return false;
    if (attentionFilter === 'followup' && !needsFollowUp(j)) return false;
    if (q) {
      const hay = [j.position, j.company, j.notes, j.location].map(x => String(x || '').toLowerCase()).join(' ');
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  const byNewest = (a, b) => String(b.scraped_at || '').localeCompare(String(a.scraped_at || ''));
  if (sort === 'company') rows.sort((a, b) => String(a.company || '').localeCompare(String(b.company || '')));
  else if (sort === 'newest') rows.sort(byNewest);
  else if (tab === 'applied') rows.sort((a, b) => String(a.applied_at || '').localeCompare(String(b.applied_at || '')));
  else if (tab === 'inbox') rows.sort((a, b) => (TIER_RANK[(a.fit || {}).tier] ?? 9) - (TIER_RANK[(b.fit || {}).tier] ?? 9) || byNewest(a, b));
  else rows.sort((a, b) => String(b.status_changed_at || '').localeCompare(String(a.status_changed_at || '')));
  return rows;
}

function sideHtml(j) {
  const id = j.id;
  if (j.status === 'new') {
    return `${cvLink(j)}<div class="btns"><button data-act="applied" class="primary">Applied</button><button data-act="skip">Skip</button></div>`;
  }
  if (j.status === 'applied') {
    const via = j.applied_via === 'auto' ? 'auto' : 'manual';
    const fu = j.followed_up_at ? ` · followed up ${rel(j.followed_up_at)}` : '';
    const reply = j.last_email && j.last_email.date >= (j.applied_at || '').slice(0, 10)
      ? ` · <a href="${esc(j.last_email.thread_link || '#')}" target="_blank" rel="noopener">reply ${rel(j.last_email.date)}</a>` : '';
    return `<span>applied ${rel(j.applied_at)} · ${via}${fu}${reply}</span>${cvLink(j)}` +
      `<div class="btns"><button data-act="followup" title="Mark that you followed up">Followed up</button>` +
      `<button data-act="interview">Interview</button><button data-act="rejected" class="danger">Rejected</button></div>`;
  }
  if (j.status === 'interview') {
    const em = j.last_email && j.last_email.subject
      ? `<a href="${esc(j.last_email.thread_link || '#')}" target="_blank" rel="noopener" dir="auto">${esc(j.last_email.subject)}</a> · ${rel(j.last_email.date)}`
      : `since ${rel(j.status_changed_at)}`;
    return `<span>${em}</span><div class="btns"><button data-act="offer" class="primary">Offer</button><button data-act="rejected" class="danger">Rejected</button></div>`;
  }
  const reason = j.status === 'archived' ? ` · ${esc(j.archive_reason || 'skipped')}` : '';
  return `<span class="badge outcome-${j.status}">${j.status}${reason}</span><span>${shortDate(j.status_changed_at)}</span>` +
    `<div class="btns"><button data-act="reopen">Reopen</button></div>`;
}

function rowHtml(j) {
  const tier = (j.fit && j.fit.tier) || 'ok';
  const reasons = (j.fit && j.fit.reasons || []).join(', ');
  const badges = [
    j.source ? `<span class="badge">${esc(j.source)}</span>` : '',
    j.agency ? `<span class="badge agency" title="Staffing agency, not the employer">agency</span>` : '',
    isUnverified(j) ? `<span class="badge unverified" title="Requirements could not be read from the posting">unverified</span>` : '',
  ].join('');
  const meta = [
    j.location ? esc(j.location) : '',
    j.date ? `posted ${rel(j.date)}` : '',
    j.scraped_at ? `added ${rel(j.scraped_at)}` : '',
  ].filter(Boolean).join(' · ');
  const title = j.link
    ? `<a class="title" href="${esc(j.link)}" target="_blank" rel="noopener"><bdi>${esc(j.position || '(no title)')}</bdi> ↗</a>`
    : `<span class="title"><bdi>${esc(j.position || '(no title)')}</bdi></span>`;
  const open = opened.has(j.id);
  return `
    <div class="row tier-${tier} ${open ? 'open' : ''}" data-id="${esc(j.id)}">
      <input type="checkbox" class="sel" ${selected.has(j.id) ? 'checked' : ''} title="Select">
      <span class="dot" title="${esc(tier)} fit${reasons ? ': ' + esc(reasons) : ''}"></span>
      <div class="main">
        <div class="line1">${title}<span class="company"><bdi>${esc(j.company || '')}</bdi></span>${badges}</div>
        <div class="meta">${meta}</div>
      </div>
      <div class="side">${sideHtml(j)}</div>
    </div>
    ${open ? expandHtml(j) : ''}`;
}

function list(items) { return items && items.length ? `<ul>${items.map(x => `<li dir="auto">${esc(x)}</li>`).join('')}</ul>` : ''; }
function expandHtml(j) {
  const reasons = (j.fit && j.fit.reasons || []).map(r => `<span class="badge">${esc(r)}</span>`).join('');
  const email = j.last_email && j.last_email.thread_link
    ? `<span>Last email: <a href="${esc(j.last_email.thread_link)}" target="_blank" rel="noopener" dir="auto">${esc(j.last_email.subject || 'thread')}</a> · ${shortDate(j.last_email.date)} · ${esc(j.last_email.classification || '')}</span>` : '';
  const phone = j.recruiter_phone ? `<span>📞 <a href="tel:${esc(j.recruiter_phone)}">${esc(j.recruiter_phone)}</a></span>` : '';
  const cv = j._cv_html ? `<a href="${esc(j._cv_html)}" target="_blank" rel="noopener">CV HTML</a>` : '';
  const statusSel = `<select data-status-select>${STATUSES.map(s => `<option value="${s}" ${s === j.status ? 'selected' : ''}>${s}</option>`).join('')}</select>` +
    `<span>via ${esc(j.status_source || '-')} · ${shortDate(j.status_changed_at)}</span>`;
  const empty = !j.description && !(j.requirements || []).length && !(j.responsibilities || []).length;
  return `
    <div class="expand" data-expand="${esc(j.id)}">
      ${reasons ? `<div class="reasons">${reasons}</div>` : ''}
      ${j.description ? `<h4>Description</h4><p dir="auto">${esc(j.description)}</p>` : ''}
      ${(j.requirements || []).length ? `<h4>Requirements</h4>${list(j.requirements)}` : ''}
      ${(j.responsibilities || []).length ? `<h4>Responsibilities</h4>${list(j.responsibilities)}` : ''}
      ${(j.nice_to_have || []).length ? `<h4>Nice to have</h4>${list(j.nice_to_have)}` : ''}
      ${empty ? `<p class="badge unverified" style="display:inline-block">No posting text captured. Use Edit to paste the requirements.</p>` : ''}
      <h4>Notes</h4>
      <textarea data-notes placeholder="Notes…" dir="auto">${esc(j.notes || '')}</textarea>
      <div class="foot">
        ${statusSel}
        ${phone}${email}${cv}
        <span style="flex:1"></span>
        <button data-act="edit">Edit</button>
      </div>
    </div>`;
}

function render() {
  const all = allEff();
  const live = all.filter(j => !['archived', 'rejected'].includes(j.status));
  const count = s => all.filter(j => j.status === s).length;
  const applied7 = all.filter(j => j.status === 'applied' && daysSince(j.applied_at) !== null && daysSince(j.applied_at) < 7).length;

  $('chips').innerHTML = [
    ['inbox', `<b>${count('new')}</b> inbox`],
    ['applied', `<b>${count('applied')}</b> applied <small>· ${applied7} this week</small>`],
    ['interview', `<b>${count('interview')}</b> interviews`],
    ['done', `<b>${count('offer')}</b> offers`],
  ].map(([t, html]) => `<span class="chip ${t === tab ? 'active' : ''}" data-tab="${t}">${html}</span>`).join('');

  for (const b of document.querySelectorAll('.tabs .tab')) {
    const t = b.dataset.tab;
    const n = TAB_STATUSES[t].reduce((acc, s) => acc + (s === 'archived' && !showArchived ? 0 : count(s)), 0);
    b.querySelector('.n').textContent = n ? n : '';
    b.classList.toggle('active', t === tab);
  }

  const unverified = all.filter(isUnverified).length;
  const followups = all.filter(needsFollowUp).length;
  const att = [];
  if (unverified) att.push(`<a data-att="unverified"><b>${unverified}</b> unverified posting${unverified > 1 ? 's' : ''} (requirements not captured)</a>`);
  if (followups) att.push(`<a data-att="followup"><b>${followups}</b> applied &gt;${CFG.followup_days}d with no reply — follow up</a>`);
  $('attention').hidden = att.length === 0;
  $('attention').innerHTML = att.join('<span class="sep">|</span>');

  $('filter-pill').hidden = !attentionFilter;
  $('filter-label').textContent = attentionFilter === 'unverified' ? 'unverified only' : attentionFilter === 'followup' ? 'needs follow-up' : '';

  const sortSel = $('sort');
  sortSel.options[0].textContent = tab === 'applied' ? 'Sort: Oldest applied' : tab === 'inbox' ? 'Sort: Fit' : 'Sort: Recent';

  const rows = visible();
  $('list').innerHTML = rows.map(rowHtml).join('');
  $('empty').hidden = rows.length > 0;
  const archivedN = count('archived');
  if (tab === 'inbox') $('empty').textContent = 'Inbox is empty.';
  else if (tab === 'done' && !showArchived && archivedN) $('empty').innerHTML = `No offers or rejections yet. <a data-show-archived>${archivedN} archived posting${archivedN > 1 ? 's' : ''} hidden — show</a>`;
  else $('empty').textContent = 'Nothing here.';

  for (const id of [...selected]) if (!rows.some(r => r.id === id)) selected.delete(id);
  $('bulk').hidden = selected.size === 0;
  $('bulk-count').textContent = selected.size;
}

// ---------------------------------------------------------------------------
// Events
// ---------------------------------------------------------------------------
document.addEventListener('click', (e) => {
  const menu = $('menu');
  if (!menu.hidden && !e.target.closest('#menu') && !e.target.closest('#menu-btn')) menu.hidden = true;
});
$('menu-btn').addEventListener('click', () => { $('menu').hidden = !$('menu').hidden; });
$('menu').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-menu]');
  if (!b) return;
  $('menu').hidden = true;
  if (b.dataset.menu === 'import') $('import-input').click();
  if (b.dataset.menu === 'export') exportJson();
  if (b.dataset.menu === 'reset') {
    if (confirm('Clear the local cache of edits in this browser? Anything already saved to jobs.json is kept.')) {
      state = {}; saveState(); render();
    }
  }
});
$('show-archived').addEventListener('change', (e) => { showArchived = e.target.checked; render(); });
$('empty').addEventListener('click', (e) => { if (e.target.closest('[data-show-archived]')) { showArchived = true; $('show-archived').checked = true; render(); } });
$('chips').addEventListener('click', (e) => { const c = e.target.closest('.chip'); if (c) switchTab(c.dataset.tab); });
$('tabs').addEventListener('click', (e) => { const b = e.target.closest('button.tab'); if (b) switchTab(b.dataset.tab); });
$('attention').addEventListener('click', (e) => {
  const a = e.target.closest('a[data-att]'); if (!a) return;
  attentionFilter = a.dataset.att;
  switchTab(attentionFilter === 'unverified' ? 'inbox' : 'applied');
});
$('filter-clear').addEventListener('click', () => { attentionFilter = null; render(); });
function switchTab(t) { tab = t; if (attentionFilter === 'unverified' && t !== 'inbox') attentionFilter = null; if (attentionFilter === 'followup' && t !== 'applied') attentionFilter = null; selected.clear(); render(); }
$('search').addEventListener('input', (e) => { query = e.target.value; render(); });
$('sort').addEventListener('change', (e) => { sort = e.target.value; render(); });

$('list').addEventListener('click', (e) => {
  const row = e.target.closest('.row');
  const expand = e.target.closest('.expand');
  const id = row ? row.dataset.id : expand ? expand.dataset.expand : null;
  if (!id) return;
  const btn = e.target.closest('button[data-act]');
  if (btn) {
    e.stopPropagation();
    const act = btn.dataset.act;
    if (act === 'applied') setStatus(id, 'applied');
    else if (act === 'skip') setStatus(id, 'archived', { reason: 'skipped' });
    else if (act === 'followup') markFollowedUp(id);
    else if (act === 'interview') setStatus(id, 'interview');
    else if (act === 'offer') setStatus(id, 'offer');
    else if (act === 'rejected') setStatus(id, 'rejected');
    else if (act === 'reopen') setStatus(id, 'new');
    else if (act === 'edit') openModal(id);
    return;
  }
  if (e.target.classList.contains('sel')) {
    e.stopPropagation();
    if (e.target.checked) selected.add(id); else selected.delete(id);
    $('bulk').hidden = selected.size === 0; $('bulk-count').textContent = selected.size;
    return;
  }
  if (e.target.closest('a') || e.target.closest('select') || e.target.closest('textarea') || expand) return;
  if (opened.has(id)) opened.delete(id); else opened.add(id);
  render();
});
$('list').addEventListener('change', (e) => {
  const expand = e.target.closest('.expand'); if (!expand) return;
  const id = expand.dataset.expand;
  if (e.target.matches('[data-status-select]')) setStatus(id, e.target.value);
  if (e.target.matches('[data-notes]')) { patch(id).notes = e.target.value; saveState(); scheduleFileSave(); }
});
$('bulk-clear').addEventListener('click', () => { selected.clear(); render(); });
$('bulk-archive').addEventListener('click', () => {
  if (!selected.size) return;
  if (!confirm(`Archive ${selected.size} posting(s)? They stay in jobs.json and can be reopened from Done.`)) return;
  for (const id of selected) setStatus(id, 'archived', { reason: 'skipped', silent: true });
  selected.clear(); saveState(); render(); scheduleFileSave();
});

// ---------------------------------------------------------------------------
// Add / Edit modal
// ---------------------------------------------------------------------------
let modalId = null;
function openModal(id) {
  modalId = id;
  const j = id ? eff(id) : {};
  $('modal-title').textContent = id ? 'Edit job' : 'Add job';
  $('m-position').value = j.position || '';
  $('m-company').value = j.company || '';
  $('m-link').value = j.link || '';
  $('m-location').value = j.location || '';
  $('m-phone').value = j.recruiter_phone || '';
  $('m-agency').checked = !!j.agency;
  $('m-requirements').value = (j.requirements || []).join('\n');
  $('m-notes').value = j.notes || '';
  $('backdrop').classList.add('show');
  $('m-position').focus();
}
function closeModal() { $('backdrop').classList.remove('show'); modalId = null; }
$('add-btn').addEventListener('click', () => openModal(null));
$('m-cancel').addEventListener('click', closeModal);
$('backdrop').addEventListener('click', (e) => { if (e.target === $('backdrop')) closeModal(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
$('m-save').addEventListener('click', () => {
  const lines = $('m-requirements').value.split('\n').map(s => s.trim()).filter(Boolean);
  const vals = {
    position: $('m-position').value.trim(), company: $('m-company').value.trim(),
    link: $('m-link').value.trim(), location: $('m-location').value.trim() || null, requirements: lines,
  };
  if (!vals.position && !vals.company) { alert('Position or company is required.'); return; }
  let id = modalId;
  if (!id) {
    id = 'manual-' + Math.random().toString(16).slice(2, 8);
    const t = nowIso();
    JOBS.push({
      id, position: vals.position, company: vals.company, source: 'Manual', link: vals.link || null,
      scraped_at: t, location: vals.location, date: t.slice(0, 10), description: null,
      responsibilities: [], requirements: lines, nice_to_have: [], last_email: null,
      status: 'new', status_source: 'user', status_changed_at: t, applied_at: null, applied_via: null,
      followed_up_at: null, archive_reason: null, notes: '', recruiter_phone: '',
      agency: false, years_min: null, extraction_ok: lines.length >= 2, extraction_attempts: 0,
      cv_variant: null, cv_tailored_at: null, dedup_key: '', fit: { tier: 'ok', reasons: [] },
    });
  }
  const p = patch(id);
  p.overrides = p.overrides || {};
  const base = getJ(id) || {};
  for (const k of OVERRIDABLE) {
    const v = vals[k];
    const same = JSON.stringify(v ?? null) === JSON.stringify(base[k] ?? null);
    if (same) delete p.overrides[k]; else p.overrides[k] = v;
  }
  p.recruiter_phone = $('m-phone').value.trim();
  p.agency = $('m-agency').checked;
  p.notes = $('m-notes').value;
  closeModal();
  commit(id);
});

// ---------------------------------------------------------------------------
// Import / Export
// ---------------------------------------------------------------------------
function stripDerived(j) { const o = {}; for (const k in j) if (!k.startsWith('_')) o[k] = j[k]; return o; }
function exportJson() {
  const data = allEff().map(stripDerived);
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'jobs.json'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
$('import-input').addEventListener('change', async (e) => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!Array.isArray(data)) throw new Error('not a JSON array');
    JOBS.length = 0; for (const j of data) JOBS.push(j);
    state = {}; saveState(); render();
  } catch (err) { alert('Import failed: ' + err.message); }
  e.target.value = '';
});

// ---------------------------------------------------------------------------
// Folder link (File System Access API). Field-scoped read-modify-write of
// jobs.json: only user-owned fields and explicit overrides are written; the
// scraper's and Gmail sync's fields on every record are preserved.
// ---------------------------------------------------------------------------
function setFileStatus(kind, msg) { const el = $('file-status'); el.className = 'file-status ' + kind; el.textContent = msg; }
async function getJobsHandle() { return dirHandle ? await dirHandle.getFileHandle('jobs.json') : null; }
function idbOpen() {
  return new Promise((resolve, reject) => {
    const r = indexedDB.open('job_tracker_fs', 2);
    r.onupgradeneeded = () => { const db = r.result; if (!db.objectStoreNames.contains('handles')) db.createObjectStore('handles'); };
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}
async function idbGet(key) { const db = await idbOpen(); return new Promise((res) => { const rq = db.transaction('handles', 'readonly').objectStore('handles').get(key); rq.onsuccess = () => { res(rq.result || null); db.close(); }; rq.onerror = () => { res(null); db.close(); }; }); }
async function idbPut(key, val) { const db = await idbOpen(); return new Promise((res) => { const tx = db.transaction('handles', 'readwrite'); tx.objectStore('handles').put(val, key); tx.oncomplete = () => { res(); db.close(); }; }); }
async function idbDel(key) { const db = await idbOpen(); return new Promise((res) => { const tx = db.transaction('handles', 'readwrite'); tx.objectStore('handles').delete(key); tx.oncomplete = () => { res(); db.close(); }; }); }
async function verifyPermission(handle) {
  const opts = { mode: 'readwrite' };
  if ((await handle.queryPermission(opts)) === 'granted') return true;
  return (await handle.requestPermission(opts)) === 'granted';
}
async function readFileJson(handle) { const f = await handle.getFile(); return f.size === 0 ? null : JSON.parse(await f.text()); }
async function writeFileJson(handle, data) {
  // Write to jobs.json.tmp, then move over jobs.json so a crash mid-write never truncates the real file.
  const payload = JSON.stringify(data, null, 2) + '\n';
  const tmp = await dirHandle.getFileHandle('jobs.json.tmp', { create: true });
  const w = await tmp.createWritable(); await w.write(payload); await w.close();
  if (typeof tmp.move === 'function') { try { await tmp.move('jobs.json'); return; } catch (e) { console.warn('move() failed; buffered copy', e); } }
  const bytes = await (await tmp.getFile()).arrayBuffer();
  const w2 = await handle.createWritable(); await w2.write(bytes); await w2.close();
  try { await dirHandle.removeEntry('jobs.json.tmp'); } catch (_) {}
}
function applyPatches(disk) {
  const byId = new Map(disk.map(j => [j.id, j]));
  for (const [id, s] of Object.entries(state)) {
    let row = byId.get(id);
    if (!row) { const jm = getJ(id); if (!jm) continue; row = stripDerived({ ...jm }); disk.push(row); byId.set(id, row); }
    for (const k of USER_FIELDS) if (k in s) row[k] = s[k];
    if (s.overrides) for (const k of OVERRIDABLE) if (k in s.overrides) row[k] = s.overrides[k];
    if (s.overrides && 'requirements' in s.overrides) row.extraction_ok = (row.requirements || []).length >= 2 || (row.description || '').length >= 200;
  }
  return disk;
}
async function loadFromJobsFile() {
  const handle = await getJobsHandle(); if (!handle) return;
  const data = await readFileJson(handle);
  if (!Array.isArray(data)) throw new Error('jobs.json is not a JSON array');
  const cvinfo = new Map(JOBS.map(j => [j.id, { _cv_pdf: j._cv_pdf, _cv_html: j._cv_html }]));
  JOBS.length = 0;
  for (const j of data) JOBS.push({ ...j, ...(cvinfo.get(j.id) || {}) });
  state = {}; saveState(); render();
}
function scheduleFileSave() {
  if (!dirHandle) return;
  setFileStatus('saving', 'Saving to jobs.json…');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      const handle = await getJobsHandle();
      const disk = await readFileJson(handle);
      if (!Array.isArray(disk)) throw new Error('jobs.json on disk is not an array');
      await writeFileJson(handle, applyPatches(disk));
      await loadFromJobsFile();
      setFileStatus('linked', `Linked: ${dirHandle.name}/jobs.json · saved ✓`);
    } catch (e) {
      console.error(e);
      setFileStatus('error', `Save failed: ${e.message}. Edits are kept in this browser.`);
    }
  }, 400);
}
async function linkToFolder() {
  if (!FSA_SUPPORTED) { alert('Folder access needs Chrome or Edge. Use Import/Export JSON from the ⋯ menu instead.'); return; }
  try {
    const dir = await window.showDirectoryPicker({ mode: 'readwrite' });
    if (!(await verifyPermission(dir))) { alert('Write permission is required to save edits.'); return; }
    dirHandle = dir;
    try { await getJobsHandle(); } catch (_) { dirHandle = null; alert(`"${dir.name}/" has no jobs.json. Pick the project folder.`); return; }
    const hasLocal = Object.keys(state).length > 0;
    if (hasLocal && !confirm(`Link "${dir.name}/jobs.json".\n\nOK = write your ${Object.keys(state).length} unsaved local edit(s) into it.\nCancel = discard local edits and load the file as-is.`)) { state = {}; saveState(); }
    await idbPut('dir', dir);
    if (Object.keys(state).length) scheduleFileSave(); else await loadFromJobsFile();
    setFileStatus('linked', `Linked: ${dir.name}/jobs.json ✓`);
  } catch (e) {
    if (e.name === 'AbortError') return;
    console.error(e); setFileStatus('error', `Link failed: ${e.message}`);
  }
}
async function tryReconnectOnStartup() {
  if (!FSA_SUPPORTED) { setFileStatus('not-linked', 'Folder auto-save needs Chrome or Edge. Edits stay in this browser; use Import/Export JSON.'); return; }
  const dir = await idbGet('dir'); if (!dir) return;
  if ((await dir.queryPermission({ mode: 'readwrite' })) === 'granted') {
    try { dirHandle = dir; await getJobsHandle(); if (Object.keys(state).length) scheduleFileSave(); else await loadFromJobsFile(); setFileStatus('linked', `Linked: ${dir.name}/jobs.json ✓`); }
    catch (e) { dirHandle = null; setFileStatus('error', `Previously linked to ${dir.name}/ but jobs.json is missing or unreadable.`); }
  } else {
    setFileStatus('not-linked', `Previously linked to ${dir.name}/ — click "Reconnect" to resume saving.`);
    $('link-btn').textContent = `Reconnect: ${dir.name}/`;
    $('link-btn').onclick = async () => {
      if (await verifyPermission(dir)) {
        try { dirHandle = dir; await getJobsHandle(); if (Object.keys(state).length) scheduleFileSave(); else await loadFromJobsFile(); setFileStatus('linked', `Linked: ${dir.name}/jobs.json ✓`); }
        catch (e) { dirHandle = null; setFileStatus('error', `Reconnect failed: ${e.message}`); }
        $('link-btn').textContent = 'Link folder…'; $('link-btn').onclick = linkToFolder;
      } else { await idbDel('dir'); $('link-btn').textContent = 'Link folder…'; $('link-btn').onclick = linkToFolder; linkToFolder(); }
    };
  }
}
$('link-btn').onclick = linkToFolder;

render();
tryReconnectOnStartup();
</script>
